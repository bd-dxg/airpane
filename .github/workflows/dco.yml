name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  signed-off-by:
    name: 校验 Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 每个提交都必须带 Signed-off-by
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          head="${{ github.event.pull_request.head.sha }}"
          failed=0
          while read -r sha; do
            if git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <[^<>]+@[^<>]+>$'; then
              echo "OK   $sha"
            else
              echo "::error::提交 $(git log -1 --format=%h "$sha") 缺少有效的 Signed-off-by 行，请使用 git commit -s"
              failed=1
            fi
          done < <(git rev-list --no-merges "$base..$head")
          exit "$failed"
