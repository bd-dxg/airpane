[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/platform-win",
    "crates/strip",
    "crates/app",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/bd-dxg/airpane"

[workspace.dependencies]
# 版本固定策略：此处写明精确到补丁的最小版本，实际锁定靠提交的 Cargo.lock。
# 变更版本必须同步更新 docs/DEPENDENCIES.md。
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
